# =============================================================================
# security.yml — GitHub Action para análisis de seguridad continua
# =============================================================================
#
# Ejecuta en cada push y pull request.
# Realiza análisis de código estático con ruff, verifica secretos con Gitleaks,
# y escanea vulnerabilidades de dependencias con pip-audit.
#
# =============================================================================

name: Security

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  schedule:
    # Ejecutar semanalmente para análisis de vulnerabilidades de deps
    - cron: "0 3 * * 1"  # Todos los lunes a las 03:00 UTC

concurrency:
  group: "security-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "latest"

jobs:
  #-----------------------------------------------------------------------
  # Static analysis — Análisis estático de código
  #-----------------------------------------------------------------------
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "${{ env.UV_VERSION }}"

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Ruff security-focused check
        run: |
          uv run ruff check . \
            --select=S \
            --ignore=S101 \
            --ignore=S102 \
            --ignore=S103 \
            --ignore=S104 \
            --ignore=S105 \
            --ignore=S106 \
            --ignore=S107 \
            --ignore=S108 \
            --ignore=S110 \
            --ignore=S603 \
            --ignore=S607

      - name: Bandit (si disponible)
        run: |
          uv pip install bandit || true
          uv run bandit -r packages/video_intake_core/ \
            -ll \
            -ii \
            --exclude tests/ \
            --exclude __pycache__ \
            || true

  #-----------------------------------------------------------------------
  # Secret scanning — Gitleaks
  #-----------------------------------------------------------------------
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  #-----------------------------------------------------------------------
  # Dependency review — Revisión de cambios en dependencias
  #-----------------------------------------------------------------------
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "${{ env.UV_VERSION }}"

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: NONE

  #-----------------------------------------------------------------------
  # Vulnerability audit — pip-audit
  #-----------------------------------------------------------------------
  vulnerability-audit:
    name: Vulnerability Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "${{ env.UV_VERSION }}"

      - name: Install dependencies
        run: uv sync --extra core

      - name: pip-audit
        run: |
          uv run --with pip-audit pip-audit --format=markdown

  #-----------------------------------------------------------------------
  # Build verification — Verificar que el proyecto se construye
  #-----------------------------------------------------------------------
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "${{ env.UV_VERSION }}"

      - name: Install all deps
        run: uv sync --group dev --extra core

      - name: Build package
        run: uv build

      - name: Verify wheel installs
        run: |
          uv pip install dist/*.whl
          uv run python -c "import video_intake_core; print('Package installs OK')"

      - name: Run basic smoke test
        run: |
          uv run python -c "import video_intake_core; from video_intake_core.acquisition import detect_video_sources; print('Core OK')"
