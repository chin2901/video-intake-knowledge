# =============================================================================
# dependency-review.yml — GitHub Action para revisión automática de dependencias
# =============================================================================
#
# Ejecuta en cada pull request para revisar cambios en dependencias antes de
# merged. Revisa licenses, vulnerabilidades conocidas, y cambios de versiones.
#
# =============================================================================

name: Dependency Review

on:
  pull_request:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  group: "dependency-review-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"

      - name: Install dependencies
        run: uv sync --group core

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-severity: critical
          comment-generated-review: true

      - name: Show dependency tree
        run: |
          echo "=== Dependency tree ==="
          uv pip list --tree || true
