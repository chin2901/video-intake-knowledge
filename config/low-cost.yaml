# =============================================================================
# low-cost.yaml — Configuración para entornos con recursos limitados
# =============================================================================
#
# Esta configuración optimiza el procesamiento para entornos con recursos
# limitados de CPU, RAM o almacenamiento, y sin modelos externos.
#
# Usar cuando:
#   - CPU o RAM limitados (ej. Raspberry Pi, VPS pequeños).
#   - No se puede usar modelos externos por coste.
#   - Se quiere la menor carga de recursos posible.
#
# =============================================================================

transcription:
  # Prioriza lo más ligero posible: captions primero, luego whisper tiny.
  strategy_order:
    - platform_captions
    - local_captions
    - whisper

  language: es
  local_engine: whisper
  model: tiny  # Modelo más pequeño y rápido
  fallback_enabled: true
  device: cpu

visual:
  scene_detection: true
  frame_sampling: scene_based
  max_candidate_frames: 10  # Reducido para ahorrar recursos
  ocr_engine: tesseract
  vision_fallback_enabled: false
  scene_detection_threshold: 30.0
  min_scene_length: 2.0

models:
  priority:
    transcript: "local"
    visual: "local"
    reasoning: "local"
  allow_external_providers: false
  require_explicit_approval_for_paid: true
  configured_providers: {}

security:
  strict_url_validation: true
  ssrf_protection: true
  allowed_domains: []
  scan_downloaded_files: false
  redact_sensitive_data: false
  prompt_injection_protection: true
  sanitize_filenames: true

storage:
  root_dir: ./artifacts
  artifact_retention_days: 30  # Retención más corta para ahorrar espacio
  max_storage_gb: 10  # Límite reducido
  cleanup_policy: age

limits:
  max_video_duration_minutes: 120  # Vídeos más cortos por defecto
  max_download_size_mb: 1000  # Descargas más pequeñas
  max_batch_items: 10  # Lotes más pequeños
  max_parallel_jobs: 1  # Solo un job a la vez para ahorrar recursos
  timeout_seconds: 1800  # Timeout más corto

acquisition:
  enabled_sources:
    - youtube
    - facebook
    - instagram
    - tiktok
    - local
  preferred_video_quality: 480p  # Calidad reducida para ahorrar ancho de banda
  preferred_audio_quality: 128k
  captions_first: true
  cache_enabled: true
  allow_authenticated_sources: false

memory:
  enabled: true
  default_provider: local
  require_confirmation: true
  max_context_tokens: 2000  # Contexto reducido para ahorrar memoria

host:
  type: generic
  session_context_strategy: compact
  auto_detect_messages: true
  auto_detect_attachments: true
