# =============================================================================
# offline.yaml — Configuración para funcionamiento sin conexión
# =============================================================================
#
# Esta configuración desactiva todas las funcionalidades que requieren
# conexión a internet. Solo se pueden procesar archivos locales.
#
# Usar cuando:
#   - No hay conexión a internet disponible.
#   - Se procesan archivos locales sin acceso remoto.
#   - Se quiere evitar cualquier tráfico de red saliente.
#
# =============================================================================

transcription:
  # Solo se pueden usar estrategias basadas en archivos locales.
  # Platform captions y local captions (de archivos ya descargados) sí funcionan.
  strategy_order:
    - local_captions
    - whisper

  language: es
  local_engine: whisper

  # En offline no hay modelo por defecto descargable, el usuario debe tener
  # el modelo instalado localmente.
  model: tiny

  fallback_enabled: true
  device: cpu

visual:
  scene_detection: true
  frame_sampling: scene_based
  max_candidate_frames: 20
  ocr_engine: tesseract
  vision_fallback_enabled: false
  scene_detection_threshold: 30.0
  min_scene_length: 2.0

models:
  priority:
    transcript: "local"
    visual: "local"
    reasoning: "local"
  allow_external_providers: false
  require_explicit_approval_for_paid: true
  configured_providers: {}

security:
  strict_url_validation: true
  ssrf_protection: true
  allowed_domains: []
  scan_downloaded_files: false
  redact_sensitive_data: false
  prompt_injection_protection: true
  sanitize_filenames: true
  allow_remote_downloads: false

storage:
  root_dir: ./artifacts
  artifact_retention_days: 90
  max_storage_gb: 100
  cleanup_policy: age

limits:
  max_video_duration_minutes: 600
  max_download_size_mb: 5000
  max_batch_items: 50
  max_parallel_jobs: 4
  timeout_seconds: 3600

acquisition:
  # En offline solo se procesan archivos locales.
  enabled_sources:
    - local
  preferred_video_quality: best
  preferred_audio_quality: best
  captions_first: true
  cache_enabled: false
  allow_authenticated_sources: false

memory:
  enabled: true
  default_provider: local
  require_confirmation: true
  max_context_tokens: 4000

host:
  type: generic
  session_context_strategy: compact
  auto_detect_messages: false
  auto_detect_attachments: true
