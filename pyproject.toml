[build-system]
requires = ["uv"]
build-backend = "uv"

[project]
name = "video-intake-knowledge"
version = "0.1.0"
description = "System for video content extraction, transcription, and knowledge generation across YouTube, Facebook, Instagram, TikTok, and local files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Video Intake Knowledge Project", email = "dev@video-intake-knowledge.local"}]
keywords = ["video", "transcription", "whisper", "yt-dlp", "facebook", "youtube", "tiktok", "instagram", "knowledge-extraction", "ocr", "scene-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.0.0",
    "tqdm>=4.0.0",
    "python-multipart>=0.0.9",
    "moviepy>=1.0.3",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
core = [
    "yt-dlp>=2025.09.19",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
]
local-transcription = [
    "openai-whisper>=20250625",
]
local-ocr = [
    "pytesseract>=0.3.10",
    "rapidocr-onnxruntime>=1.3.0",
]
visual-analysis = [
    "opencv-python-headless>=4.10.0",
    "PySceneDetect>=0.6.5",
    "imageio[ffmpeg]>=2.34.0",
]
full = [
    "openai-whisper>=20250625",
    "opencv-python-headless>=4.10.0",
    "PySceneDetect>=0.6.5",
    "pytesseract>=0.3.10",
    "rapidocr-onnxruntime>=1.3.0",
    "moviepy>=1.0.3",
]
development = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "openai-whisper>=20250625",
    "opencv-python-headless>=4.10.0",
    "PySceneDetect>=0.6.5",
    "pytesseract>=0.3.10",
    "moviepy>=1.0.3",
]

[project.scripts]
video-intake = "video_intake_core.cli:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai-whisper>=20250625",
    "opencv-python-headless>=4.10.0",
    "PySceneDetect>=0.6.5",
    "pytesseract>=0.3.10",
    "moviepy>=1.0.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint]
exclude = ["__init__.py"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
scripts_legacy_extension_sypi = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
addopts = "--cov=video_intake_core --cov-report=term-missing --cov-report=html"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["video_intake_core"]
branch = true
omit = ["**/__init__.py", "**/cli.py", "**/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
