# =============================================================================
# config.example.yaml — Configuración de ejemplo para el plugin de Hermes
# =============================================================================
#
# Este archivo demuestra cómo configurar video-intake-knowledge cuando se
# usa como plugin de Hermes Agent.
#
# Copia este archivo a tu directorio de configuración de Hermes y modifica
# los valores según tus necesidades.
#
# Ubicación esperada: ~/.hermes/config.d/video-intake-knowledge.yaml
# o dentro de tu config.yaml principal bajo la clave "video_intake".
#
# =============================================================================

video_intake:
  # ------------------------------------------------------------------
  # Transcripción
  # ------------------------------------------------------------------
  transcription:
    # Orden de estrategias a intentar
    strategy_order:
      - platform_captions
      - local_captions
      - whisper

    # Idioma preferido
    language: es

    # Motor local de transcripción
    local_engine: whisper

    # Modelo por defecto
    model: tiny

    # ¿Intentar fallback si la estrategia principal falla?
    fallback_enabled: true

    # Dispositivo para inferencia
    device: cpu

    # Si Hermes expone GPU, se puede cambiar a "cuda" o "mps"
    # device: cuda

  # ------------------------------------------------------------------
  # Visual
  # ------------------------------------------------------------------
  visual:
    scene_detection: true
    frame_sampling: scene_based
    max_candidate_frames: 20
    ocr_engine: tesseract
    vision_fallback_enabled: false
    scene_detection_threshold: 30.0
    min_scene_length: 2.0

  # ------------------------------------------------------------------
  # Storage
  # ------------------------------------------------------------------
  storage:
    root_dir: ./artifacts
    artifact_retention_days: 90
    max_storage_gb: 100
    cleanup_policy: age

  # ------------------------------------------------------------------
  # Limits
  # ------------------------------------------------------------------
  limits:
    max_video_duration_minutes: 600
    max_download_size_mb: 5000
    max_batch_items: 50
    max_parallel_jobs: 4
    timeout_seconds: 3600

  # ------------------------------------------------------------------
  # Acquisition
  # ------------------------------------------------------------------
  acquisition:
    enabled_sources:
      - youtube
      - facebook
      - instagram
      - tiktok
      - local
    preferred_video_quality: best
    preferred_audio_quality: best
    captions_first: true
    cache_enabled: true
    allow_authenticated_sources: false

  # ------------------------------------------------------------------
  # Memory
  # ------------------------------------------------------------------
  memory:
    enabled: true
    default_provider: local
    require_confirmation: true
    max_context_tokens: 4000

  # ------------------------------------------------------------------
  # Security
  # ------------------------------------------------------------------
  security:
    strict_url_validation: true
    ssrf_protection: true
    allowed_domains: []
    scan_downloaded_files: false
    redact_sensitive_data: false
    prompt_injection_protection: true
    sanitize_filenames: true

  # ------------------------------------------------------------------
  # Host — Configuración specifica de Hermes
  # ------------------------------------------------------------------
  host:
    type: hermes
    session_context_strategy: compact
    auto_detect_messages: true
    auto_detect_attachments: true

  # ------------------------------------------------------------------
  # CLI path — Ruta al script standalone
  # ------------------------------------------------------------------
  # Este path se usa cuando Hermes invoca video-intake vía CLI.
  # Ajusta según dónde se haya instalado el proyecto.
  cli_path: "/ruta/a/video-intake-knowledge/scripts/standalone_hermes.sh"

  # ------------------------------------------------------------------
  # Hooks — Control de los hooks de detección
  # ------------------------------------------------------------------
  hooks:
    # Habilitar detección automática de URLs de vídeo en mensajes
    detect_on_message: true

    # Habilitar detección de adjuntos de vídeo
    detect_on_attachment: true

    # Ignorar estas plataformas (si no quieres detectarlas)
    # ignored_platforms:
    #   - tiktok
