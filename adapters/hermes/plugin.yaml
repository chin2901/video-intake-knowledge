# =============================================================================
# plugin.yaml — Plugin de Hermes Agent para video-intake-knowledge
# =============================================================================
#
# Describe cómo Hermes Agent integra video-intake-knowledge como
# una habilidad de extracción de contenido audiovisual.
#
# Coloca este archivo en: adapters/hermes/plugin.yaml
#
# Hermes Agent lo detectará automáticamente si está en el directorio
# de plugins o se referencia en la configuración de herramientasTools.
#
# Para probar:
#   vitk --help
#   vitk detectar "https://www.youtube.com/watch?v=VIDEO_ID"
#   vitk extraer "https://www.facebook.com/..." --select transcript
#
# =============================================================================

name: video-intake-knowledge
version: "1.0.0"
description: |
  Extrae contenido de vídeos de múltiples plataformas (YouTube, Facebook,
  Instagram, TikTok y archivos locales). Soporta descarga, transcripción
  con Whisper, OCR con Tesseract, análisis visual con detección de
  escenas, y generación de contextos estructurados.
  
  Fuentes compatibles: YouTube (incl. Shorts), Facebook (Video, Watch),
  Instagram Reels, TikTok, archivos MP4/MOV/MKV/WebM/AVI/M4V/MPEG/MPG/FLV/WMV.
  
  Salida: transcripciones (txt, srt, vtt), contextos markdown/mdx,
  resultados OCR JSON, frames PNG, manifiestos de artefactos.

author: AibOS / Hermes Agent Integration
license: MIT

# ------------------------------------------------------------------
# Commands — Qué comandos registra este plugin
# ------------------------------------------------------------------
commands:
  - name: vitk
    path: ../../scripts/standalone_hermes.sh
    description: |
      CLI principal de video-intake-knowledge.
      Comandos: detectar, inspect, extraer, menu, list, status, help.

  - name: video-intake
    path: ../../scripts/standalone_hermes.sh
    aliases:
      - vitk
    description: |
      Alias para vitk. Puedes usar cualquier nombre.

# ------------------------------------------------------------------
# Tools — Herramientas que este plugin expone a Hermes Agent
# ------------------------------------------------------------------
tools:
  - name: video_intake_detect
    description: |
      Detecta si una URL o archivo es un vídeo procesable por el sistema.
      Devuelve el tipo de fuente, URL resuelta, título y plataforma.
    command: ../../scripts/standalone_hermes.sh detectar "$input"
    parameters:
      - name: input
        type: string
        description: |
          URL de YouTube/Facebook/Instagram/TikTok o ruta a archivo local
          (MP4, MOV, MKV, WebM, AVI, etc.)

  - name: video_intake_inspect
    description: |
      Obtiene metadatos de un vídeo: título, duración, resolución,
      codecs, streams, sin descargarlo.
    command: ../../scripts/standalone_hermes.sh inspect "$input"
    parameters:
      - name: input
        type: string
        description: |
          URL de vídeo o ruta a archivo local

  - name: video_intake_extract
    description: |
      Extrae contenido de un vídeo. Especifica qué quieres obtener
      con --select: transcript, audio, audio-context, visual-context,
      frames, ocr, o todo.
    command: ../../scripts/standalone_hermes.sh extraer "$input" $options
    parameters:
      - name: input
        type: string
        description: |
          URL de vídeo o ruta a archivo local
      - name: options
        type: string
        description: |
          Opciones separadas por espacios. Ej: --select transcript,audio
          --lang es --model tiny --out ./artifacts --yes

  - name: video_intake_menu
    description: |
      Inicia el modo interactivo para uno o más vídeos. El usuario
      puede seleccionar qué extraer de cada uno.
    command: ../../scripts/standalone_hermes.sh menu $inputs
    parameters:
      - name: inputs
        type: string
        description: |
          Una o más URLs o rutas de archivo separadas por espacio

  - name: video_intake_list
    description: |
      Lista los jobs de extracción pendientes en progreso.
    command: ../../scripts/standalone_hermes.sh list

  - name: video_intake_status
    description: |
      Muestra el estado de un job de extracción específico.
    command: ../../scripts/standalone_hermes.sh status "$job_id"
    parameters:
      - name: job_id
        type: string
        description: "ID del job (ejemplo: job_...)"

# ------------------------------------------------------------------
# Hooks — Hooks que este plugin puede responder
# ------------------------------------------------------------------
hooks:
  - event: message.processed
    condition: |
      mensaje contiene URL de youtube.com, facebook.com,
      instagram.com, tiktok.com o archivo de vídeo adjunto
    actions:
      - type: tool
        tool: video_intake_detect
        args:
          input: "{{detected_video_url}}"

  - event: user.request.video_extraction
    actions:
      - type: tool
        tool: video_intake_extract
        args:
          input: "{{video_url}}"
          options: "--select $selection --lang $lang"

# ------------------------------------------------------------------
# Dependencies — Qué necesita este plugin
# ------------------------------------------------------------------
dependencies:
  python: ">=3.10"
  system:
    - ffmpeg
    - tesseract
  python_packages:
    - yt-dlp
    - openai-whisper
    - Pillow
    - pytesseract
    - opencv-python
    - py-scene-detect
    - numpy
    - PyYAML
    - jsonschema
    - rich
    - questionary

# ------------------------------------------------------------------
# Examples — Ejemplos de uso
# ------------------------------------------------------------------
examples:
  - description: "Detectar si una URL es procesable"
    command: "vitk detectar https://www.youtube.com/watch?v=dQw4w9WgXcQ"

  - description: "Obtener metadatos sin descargar"
    command: "vitk inspect https://www.facebook.com/watch/?v=12345"

  - description: "Extraer transcripción y audio"
    command: |
      vitk extraer https://www.youtube.com/watch?v=dQw4w9WgXcQ \
        --select transcript,audio --lang es --model tiny --yes

  - description: "Extraer todo de múltiples vídeos"
    command: |
      vitk menu \
        https://www.youtube.com/watch?v=dQw4w9WgXcQ \
        /ruta/a/video_local.mp4

  - description: "Transcripción con modelo específico"
    command: |
      vitk extraer https://www.tiktok.com/@user/video/12345 \
        --select transcript --lang es --model small --yes

# =============================================================================
# Notas de integración
# =============================================================================
#
# Este plugin está diseñado para trabajarse en conjunto con el paquete
# Python video_intake_core. El script standalone_hermes.sh actúa como
# capa de integración, activando el entorno virtual y ejecutando las
# funciones Python subyacentes.
#
# Para integraciones más profundas (AGY, OpenCode, Claude Code, Codex),
# ver los adaptadores en adapters/<platform>/.
#
# =============================================================================
