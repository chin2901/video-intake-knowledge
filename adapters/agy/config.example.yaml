# =============================================================================
# config.example.yaml — Configuración de ejemplo para AGY entorno
# =============================================================================
#
# Este archivo demuestra cómo configurar video-intake-knowledge en un
# entorno AGY. Modifica las secciones según tus capacidades y requisitos.
#
# =============================================================================

# =============================================================================
# Transcripción
# =============================================================================

transcription:
  # Estrategia de transcripción preferida:
  #   "captions" = usar subtítulos originales de la plataforma cuando estén
  #                 disponibles (gratuito, rápido, sin modelo local)
  #   "whisper"  = usar modelo Whisper local para generar transcripción
  #                 desde el audio extraído
  #   "auto"     = intentar captions primero; si no están disponibles,
  #                 recurrir a Whisper
  strategy: "auto"

  # Modelo Whisper a usar cuando la estrategia lo requiera.
  #   "tiny"   — más rápido, menos preciso (recomendado para low-cost)
  #   "base"   — equilibrio velocidad/precisión
  #   "small"  — mayor precisión, más lento
  #   "medium" — aún mayor precisión (recomendado para producción)
  #   "large"  — máxima precisión, lento, requiere GPU recomendada
  whisper_model: "base"

  # Idioma de transcripción. "auto" detecta automáticamente;
  # si sabes que todos tus vídeos son en español, pon "es" para mayor
  # velocidad y precisión.
  language: "auto"

  # Diseñar resultado con timestamps por defecto.
  include_timestamps: true

  # Nivel de detalle de los timestamps.
  #   "segment"  — por segmento de transcripción (recomendado)
  #   "word"     — por palabra (solo Whisper, más verboso)
  timestamp_granularity: "segment"

# =============================================================================
# Contexto de audio
# =============================================================================

audio_context:
  generate: true

  # Resumen ejecutivo del contenido del audio.
  summary:
    generate: true
    max_sentences: 12
    language: "es"

  # Índice temporal de los temas tratados en el vídeo.
  timeline:
    generate: true
    split_by_topic: true
    min_segment_duration_sec: 30

  # Detección de temas presentes en la transcripción.
  topics:
    generate: true
    max_topics: 15

  # Extracción de entidades (personas, organizaciones, lugares)
  # sustantivos clave y frases nominales relevantes.
  entities:
    generate: true
    max_entities: 50

  # Citas textuales o parciales destacadas del contenido.
  quotes:
    generate: true
    max_quotes: 10
    min_quote_length: 20

  # Nivel de confianza estimado del contexto generado.
  confidence:
    generate: true
    include_for: ["summary", "topics", "entities"]

  language: "es"

# =============================================================================
# Contexto visual
# =============================================================================

visual_context:
  generate: true

  # Detección de escenas: cambios relevantes entre planos o secuencias.
  scene_detection:
    generate: true
    method: "content"
    threshold: 30

  # Extracción de keyframes representativos de cada escena.
  keyframes:
    generate: true
    max_per_scene: 3
    format: "png"

  # Análisis de frames para extracción de contenido visual:
  # diagramas, esquemas, texto en pantalla, interfaces, etc.
  frame_analysis:
    generate: true
    ocr:
      enable: true
      min_confidence: 60
      preprocess: true
      languages: ["spa"]
    visual_descriptions:
      enable: true
      extract_diagram: true
      extract_screenshots: true
      extract_flowcharts: true

  language: "es"

# =============================================================================
# Almacenamiento
# =============================================================================

storage:
  # Límite máximo de espacio en disco para artefactos, en GB.
  max_storage_gb: 50

  # Retener artefactos de trabajos completados durante N días.
  retention_days: 30

  # Limpieza automática de artefactos antiguos.
  auto_cleanup: "monthly"

  # Deduplicación: si un archivo con el mismo hash SHA-256 ya existe,
  # no se guarda de nuevo; se registra como referencia.
  deduplication: true

# =============================================================================
# Memoria
# =============================================================================

memory:
  # Habilitar el sistema de memoria para almacenar conocimiento extraído.
  enabled: true

  # Proveedor de memoria a usar:
  #   "local"  — SQLite local (por defecto, siempre disponible)
  #   "host_native" — usar el sistema nativo de memoria del host
  provider: "local"

  # Etiquetas por defecto para las entradas de memoria creadas.
  default_tags:
    - "video-intake-knowledge"
    - "auto-extracted"

  # Buscar en memoria existente antes de crear nueva entrada.
  dedupe_by_video: true

  # Limpiar entradas de memoria automáticamente tras N días.
  retention_days: 0

# =============================================================================
# Seguridad
# =============================================================================

security:
  ssrf_protection: true

  blocked_hosts: []

  verify_mime: true

  allowed_mime_types:
    - "video/mp4"
    - "video/quicktime"
    - "video/x-msvideo"
    - "video/webm"
    - "video/x-matroska"
    - "video/mpeg"
    - "audio/mpeg"
    - "audio/wav"
    - "audio/mp4"
    - "audio/ogg"
    - "audio/flac"
    - "audio/x-m4a"

  sanitize_filenames: true
  redact_sensitive_data: true
  prompt_injection_protection: true

  max_download_size_mb: 500
  max_audio_size_mb: 100
  network_timeout_secs: 60
  ffmpeg_timeout_secs: 300
  whisper_timeout_secs: 1800

# =============================================================================
# Procesamiento por lotes
# =============================================================================

batch:
  max_concurrent: 1
  auto_enable: false
  auto_select_operations: true

# =============================================================================
# Propuestas de build
# =============================================================================

build_proposals:
  generate_auto: false
  output_formats:
    - "markdown"
    - "mdx"
  max_proposals: 5

# =============================================================================
# Configuración de la plataforma
# =============================================================================

platform:
  ffmpeg_path: "ffmpeg"
  ffprobe_path: "ffprobe"
  yt_dlp_path: "yt-dlp"
  tesseract_path: "tesseract"
  tesseract_default_lang: "spa"
  whisper_model_dir: null
  captions_cache_dir: null

# =============================================================================
# Hooks de ejecución
# =============================================================================

hooks:
  on_detection: []
  on_download_complete: []
  on_transcription_complete: []
  on_extraction_complete: []
  on_error: []

# =============================================================================
# Logging
# =============================================================================

logging:
  level: "info"
  retention_days: 7
  audit_trail: true

# =============================================================================
# Desarrollo
# =============================================================================

development:
  strict_checks: false
  keep_intermediates: false
  verbose_network: false
